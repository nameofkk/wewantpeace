<p class="sg w6 f9 mx l5 c3">DID YOU KNOW?</p>
<p class="nk fd c5 h7 m4">The US imports only <b class="c1">~6%</b> of its oil from the Persian Gulf — but global oil is priced on a single market. When Hormuz closes, <b class="cd">all oil prices rise</b>, regardless of where yours comes from.</p>
<p class="nk fb c7 m4">Source: EIA · 2025 data</p>
