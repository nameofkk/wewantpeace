<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WeWantPeace 프로모션 스크린샷 (1080x1920) x4 - 한국어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #000;
    padding: 40px;
    display: flex;
    gap: 40px;
  }
  .frame {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #0F172A 0%, #1a2744 100%);
  }
  .glow {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
  }

  /* 상단 텍스트 */
  .top {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 80px 60px 40px;
  }
  .headline {
    font-size: 54px;
    font-weight: 900;
    color: #F8FAFC;
    line-height: 1.35;
    margin-bottom: 16px;
    letter-spacing: -1px;
  }
  .headline em {
    font-style: normal;
    background: linear-gradient(135deg, #60A5FA, #34D399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subline {
    font-size: 26px;
    color: #94A3B8;
    line-height: 1.5;
    font-weight: 400;
  }

  /* 폰 목업 - 전체 보이게 */
  .phone-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 20px 100px 60px;
  }
  .phone {
    width: 620px;
    height: 1300px;
    background: #000;
    border-radius: 50px;
    border: 4px solid #333;
    overflow: hidden;
    box-shadow:
      0 0 0 2px #1a1a1a,
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(59,130,246,0.08);
    display: flex;
    flex-direction: column;
  }
  /* 상단 노치 */
  .phone-status {
    height: 50px;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .notch {
    width: 160px;
    height: 28px;
    background: #000;
    border-radius: 0 0 18px 18px;
    position: absolute;
    top: 0;
  }
  /* 스크린샷 이미지 영역 */
  .phone-screen {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #0F172A;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  /* 이미지 없을 때 안내 */
  .phone-screen .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    font-size: 18px;
    text-align: center;
    padding: 40px;
    line-height: 1.6;
  }
  /* 하단 홈버튼 바 */
  .phone-home {
    height: 28px;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .phone-home .bar {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }
</style>
</head>
<body>

<!--
  사용법:
  1. 앱에서 각 페이지 스크린샷을 캡처 (모바일 또는 DevTools 모바일 모드)
  2. 이 HTML과 같은 폴더에 이미지 파일 저장
  3. 아래 <img src="..."> 경로를 실제 파일명으로 변경
  4. 브라우저에서 열고 각 프레임을 1080x1920으로 캡처

  추천 스크린샷:
  - screenshot-home.png : 홈 대시보드 (긴장도 리스트 보이는 화면)
  - screenshot-impact.png : 홈 하단 영향도 섹션
  - screenshot-map.png : 이슈 지도 페이지
  - screenshot-feed.png : 피드/알림 페이지
-->

<!-- ========== 프레임 1: 긴장도 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(239,68,68,0.3), transparent); top: 50px; right: -200px;"></div>
  <div class="top">
    <div class="headline">지금, 세계는<br><em>얼마나 위험한가</em></div>
    <div class="subline">국가별 긴장도 지수를<br>실시간으로 확인하세요</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status"><div class="notch"></div></div>
      <div class="phone-screen">
        <img src="screenshot-home.png" alt="Home Dashboard">
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 프레임 2: 영향도 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(59,130,246,0.3), transparent); top: 100px; left: -200px;"></div>
  <div class="top">
    <div class="headline">이 분쟁,<br><em>나에게 무슨 영향?</em></div>
    <div class="subline">경제 · 무역 · 여행<br>내 나라 기준 영향도 분석</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status"><div class="notch"></div></div>
      <div class="phone-screen">
        <img src="screenshot-impact.png" alt="Impact Analysis">
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 프레임 3: 지도 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(16,185,129,0.3), transparent); top: 50px; right: -150px;"></div>
  <div class="top">
    <div class="headline">한눈에 보는<br><em>글로벌 분쟁 지도</em></div>
    <div class="subline">히트맵과 마커로<br>분쟁 현황을 직관적으로</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status"><div class="notch"></div></div>
      <div class="phone-screen">
        <img src="screenshot-map.png" alt="Conflict Map">
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 프레임 4: 알림 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(251,191,36,0.3), transparent); top: 50px; left: -150px;"></div>
  <div class="top">
    <div class="headline">내 관심 국가<br><em>긴급 알림 즉시 수신</em></div>
    <div class="subline">중요한 이슈만 골라서<br>실시간 푸시 알림</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status"><div class="notch"></div></div>
      <div class="phone-screen">
        <img src="screenshot-feed.png" alt="Feed & Alerts">
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

</body>
</html>
