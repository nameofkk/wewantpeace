<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WeWantPeace 프로모션 스크린샷 (1080x1920) x4 - 한국어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #000;
    padding: 40px;
    display: flex;
    gap: 40px;
  }
  .frame {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #0F172A 0%, #1a2744 100%);
  }
  .glow {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
  }
  .top {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 60px 30px;
    width: 100%;
  }
  .headline {
    font-size: 64px;
    font-weight: 900;
    color: #F8FAFC;
    line-height: 1.3;
    margin-bottom: 20px;
    letter-spacing: -1px;
  }
  .headline em {
    font-style: normal;
    background: linear-gradient(135deg, #60A5FA, #34D399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subline {
    font-size: 30px;
    color: #94A3B8;
    line-height: 1.5;
    font-weight: 400;
  }
  .phone-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 10px 100px 40px;
  }
  .phone {
    width: 620px;
    height: 1300px;
    background: #000;
    border-radius: 50px;
    border: 4px solid #333;
    overflow: hidden;
    box-shadow:
      0 0 0 2px #1a1a1a,
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(59,130,246,0.08);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 상태바 */
  .phone-status {
    height: 50px;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }
  .notch {
    width: 160px;
    height: 28px;
    background: #000;
    border-radius: 0 0 18px 18px;
    position: absolute;
    top: 0;
  }
  .status-left {
    position: absolute;
    left: 24px;
    top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    font-weight: 500;
  }
  .status-right {
    position: absolute;
    right: 24px;
    top: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
  }
  .battery {
    width: 24px;
    height: 12px;
    border: 1.5px solid rgba(255,255,255,0.7);
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 1.5px;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 5px;
    background: rgba(255,255,255,0.5);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    width: 75%;
    height: 100%;
    background: rgba(255,255,255,0.8);
    border-radius: 1px;
  }
  /* 와이파이 아이콘 (CSS) */
  .wifi {
    width: 16px;
    height: 12px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .wifi-bar {
    width: 3px;
    background: rgba(255,255,255,0.8);
    border-radius: 1px;
    margin: 0 0.5px;
  }
  .wifi-bar:nth-child(1) { height: 4px; }
  .wifi-bar:nth-child(2) { height: 7px; }
  .wifi-bar:nth-child(3) { height: 10px; }
  .wifi-bar:nth-child(4) { height: 13px; }

  /* 스크린 */
  .phone-screen {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #0F172A;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  /* 이미지 없을 때 */
  .phone-screen .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    font-size: 16px;
    text-align: center;
    padding: 40px;
    line-height: 1.6;
  }

  /* 하단 네비게이션 바 */
  .phone-navbar {
    height: 56px;
    background: #0F172A;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-shrink: 0;
    padding: 0 10px;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: #64748B;
    font-weight: 500;
  }
  .nav-icon { font-size: 18px; }
  .nav-active { color: #60A5FA; }

  /* 홈 인디케이터 */
  .phone-home {
    height: 24px;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .phone-home .bar {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
  }
</style>
</head>
<body>

<!--
  사용법:
  1. Chrome DevTools 모바일 모드 (393x852)
  2. www.wewantpeace.live 각 페이지 캡처
  3. 이 HTML과 같은 폴더에 아래 파일명으로 저장
  4. 브라우저에서 열고 프레임 하나씩 1080x1920으로 캡처
-->

<!-- ========== 1. 홈 대시보드 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(59,130,246,0.3), transparent); top: 50px; right: -200px;"></div>
  <div class="top">
    <div class="headline">세계 분쟁이<br><em>내 삶에 미치는 영향</em></div>
    <div class="subline">실시간 모니터링 대시보드로<br>한눈에 파악하세요</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status">
        <div class="notch"></div>
        <div class="status-left">14:32</div>
        <div class="status-right">
          <div class="wifi">
            <div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div>
          </div>
          <span style="font-size:12px;">LTE</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>
      <div class="phone-screen">
        <!-- 홈(/) 스크린샷: screenshot-home.png -->
        <img src="screenshot-home.png" alt="Home">
      </div>
      <div class="phone-navbar">
        <div class="nav-item nav-active"><span class="nav-icon">&#x1F3E0;</span>홈</div>
        <div class="nav-item"><span class="nav-icon">&#x1F30D;</span>지도</div>
        <div class="nav-item"><span class="nav-icon">&#x1F4F0;</span>피드</div>
        <div class="nav-item"><span class="nav-icon">&#x2699;&#xFE0F;</span>설정</div>
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 2. 이슈 피드 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(239,68,68,0.3), transparent); top: 100px; left: -200px;"></div>
  <div class="top">
    <div class="headline">전 세계 분쟁 이슈<br><em>실시간으로 추적</em></div>
    <div class="subline">100+ 뉴스 소스에서 수집한<br>최신 이슈를 확인하세요</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">

        <div class="notch"></div>
        <div class="status-left">14:33</div>
        <div class="status-right">
          <div class="wifi">
            <div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div>
          </div>
          <span style="font-size:12px;">LTE</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>
      <div class="phone-screen">
        <!-- 피드(/feed) 스크린샷: screenshot-feed.png -->
        <img src="screenshot-feed.png" alt="Feed">
      </div>
      <div class="phone-navbar">
        <div class="nav-item"><span class="nav-icon">&#x1F3E0;</span>홈</div>
        <div class="nav-item"><span class="nav-icon">&#x1F30D;</span>지도</div>
        <div class="nav-item nav-active"><span class="nav-icon">&#x1F4F0;</span>피드</div>
        <div class="nav-item"><span class="nav-icon">&#x2699;&#xFE0F;</span>설정</div>
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 3. 이슈 지도 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(16,185,129,0.3), transparent); top: 50px; right: -150px;"></div>
  <div class="top">
    <div class="headline">한눈에 보는<br><em>글로벌 분쟁 지도</em></div>
    <div class="subline">히트맵과 마커로<br>분쟁 현황을 직관적으로</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status">
        <div class="notch"></div>
        <div class="status-left">14:34</div>
        <div class="status-right">
          <div class="wifi">
            <div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div>
          </div>
          <span style="font-size:12px;">LTE</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>
      <div class="phone-screen">
        <!-- 지도(/map) 스크린샷: screenshot-map.png -->
        <img src="screenshot-map.png" alt="Map">
      </div>
      <div class="phone-navbar">
        <div class="nav-item"><span class="nav-icon">&#x1F3E0;</span>홈</div>
        <div class="nav-item nav-active"><span class="nav-icon">&#x1F30D;</span>지도</div>
        <div class="nav-item"><span class="nav-icon">&#x1F4F0;</span>피드</div>
        <div class="nav-item"><span class="nav-icon">&#x2699;&#xFE0F;</span>설정</div>
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

<!-- ========== 4. 긴장도 ========== -->
<div class="frame">
  <div class="bg"></div>
  <div class="glow" style="background: radial-gradient(circle, rgba(251,191,36,0.3), transparent); top: 50px; left: -150px;"></div>
  <div class="top">
    <div class="headline">국가별 긴장도를<br><em>실시간 점수로</em></div>
    <div class="subline">실시간으로 갱신되는<br>긴장도 지수를 확인하세요</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status">
        <div class="notch"></div>
        <div class="status-left">14:35</div>
        <div class="status-right">
          <div class="wifi">
            <div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div><div class="wifi-bar"></div>
          </div>
          <span style="font-size:12px;">LTE</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>
      <div class="phone-screen">
        <!-- 긴장도(/tension) 스크린샷: screenshot-tension.png -->
        <img src="screenshot-tension.png" alt="Tension">
      </div>
      <div class="phone-navbar">
        <div class="nav-item"><span class="nav-icon">&#x1F3E0;</span>홈</div>
        <div class="nav-item"><span class="nav-icon">&#x1F30D;</span>지도</div>
        <div class="nav-item"><span class="nav-icon">&#x1F4F0;</span>피드</div>
        <div class="nav-item"><span class="nav-icon">&#x2699;&#xFE0F;</span>설정</div>
      </div>
      <div class="phone-home"><div class="bar"></div></div>
    </div>
  </div>
</div>

</body>
</html>
