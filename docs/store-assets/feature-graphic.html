<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WeWantPeace Feature Graphic 1024x500 (KO + EN)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #000;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .frame {
    width: 1024px;
    height: 500px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* 배경 */
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #070d1a 0%, #0F172A 30%, #162033 60%, #0d1525 100%);
  }

  /* 그리드 */
  .scan-grid {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image:
      linear-gradient(rgba(59,130,246,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.035) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* 스캔 라인 */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    z-index: 2;
    background: linear-gradient(90deg, transparent 5%, rgba(59,130,246,0.25) 30%, rgba(96,165,250,0.45) 50%, rgba(59,130,246,0.25) 70%, transparent 95%);
    box-shadow: 0 0 15px rgba(59,130,246,0.25), 0 0 40px rgba(59,130,246,0.08);
    animation: scanH 3.5s linear infinite;
  }
  @keyframes scanH {
    0% { top: -1px; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* 레이더 */
  .radar {
    position: absolute;
    z-index: 2;
    border-radius: 50%;
    border: 1px solid rgba(59,130,246,0.12);
    animation: rPulse 3s ease-out infinite;
  }
  @keyframes rPulse {
    0% { transform: scale(0.4); opacity: 0.5; }
    100% { transform: scale(2); opacity: 0; }
  }

  /* 점멸 */
  .blink {
    position: absolute;
    z-index: 3;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 6px rgba(96,165,250,0.5);
    animation: bFade 2s ease-in-out infinite;
  }
  @keyframes bFade {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }

  /* 글로우 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
  }

  /* 콘텐츠 */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 60px;
    gap: 40px;
  }

  /* 왼쪽 */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .logo-row img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(59,130,246,0.25);
  }
  .logo-name {
    font-size: 28px;
    font-weight: 800;
    color: #F8FAFC;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 26px;
    font-weight: 800;
    color: #E2E8F0;
    line-height: 1.4;
    margin-bottom: 22px;
  }
  .tagline em {
    font-style: normal;
    background: linear-gradient(135deg, #60A5FA, #34D399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    color: #CBD5E1;
    font-weight: 500;
  }
  .pill .d {
    width: 5px; height: 5px;
    border-radius: 50%;
  }

  /* 오른쪽: 미니 폰 */
  .right {
    flex-shrink: 0;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .mini-phone {
    width: 200px;
    height: 400px;
    background: #000;
    border-radius: 26px;
    border: 3px solid #2a2a2a;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #111,
      0 10px 40px rgba(0,0,0,0.6),
      0 0 50px rgba(59,130,246,0.06);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .mp-status {
    height: 18px;
    background: #0F172A;
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mp-notch {
    width: 55px;
    height: 11px;
    background: #000;
    border-radius: 0 0 7px 7px;
    position: absolute;
    top: 0;
  }
  .mp-screen {
    flex: 1;
    overflow: hidden;
    background: #0F172A;
  }
  .mp-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .mp-home {
    height: 12px;
    background: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mp-home .bar {
    width: 45px;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }

  /* 뒤쪽 작은 폰 */
  .mini-phone-back {
    width: 170px;
    height: 340px;
    background: #000;
    border-radius: 22px;
    border: 3px solid #222;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    opacity: 0.7;
    transform: translateY(20px);
  }
  .mini-phone-back .mp-screen img {
    object-position: center center;
  }
</style>
</head>
<body>

<!--
  사용법:
  1. 같은 폴더에 스크린샷 이미지가 있어야 함
  2. 브라우저에서 열고 각 프레임을 1024x500으로 캡처
  3. PNG로 저장 → Play Console 업로드
-->

  <div class="blink" style="top:25%;right:3%;animation-delay:1.5s;"></div>

  <div class="glow" style="width:350px;height:350px;background:radial-gradient(circle,rgba(59,130,246,0.12),transparent);top:-100px;right:150px;"></div>

      </div>
      <div class="pills">
        <div class="pill"><span class="d" style="background:#EF4444;"></span>긴장도 지수</div>
        <div class="pill"><span class="d" style="background:#3B82F6;"></span>실시간 알림</div>
        <div class="pill"><span class="d" style="background:#10B981;"></span>분쟁 지도</div>
        <div class="pill"><span class="d" style="background:#FBBF24;"></span>이슈 피드</div>
      </div>
    </div>
    <div class="right">
      <div class="mini-phone-back">
        <div class="mp-status"><div class="mp-notch"></div></div>
        <div class="mp-screen">
          <img src="screenshot-map.png" alt="Map">

      <div class="mini-phone">
        <div class="mp-status"><div class="mp-notch"></div></div>

          <img src="screenshot-home.png" alt="Home">
        </div>
        <div class="mp-home"><div class="bar"></div></div>
      </div>
    </div>
  </div>
</div>
