<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WeWantPeace Feature Graphic 1024x500</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* 배경 그리드 효과 */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* 글로우 효과 */
  .glow-1 {
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    top: -50px; right: 100px;
  }
  .glow-2 {
    position: absolute;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(239,68,68,0.1) 0%, transparent 70%);
    bottom: -30px; left: 150px;
  }
  .glow-3 {
    position: absolute;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
    top: 100px; left: 50px;
  }
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 0 80px;
  }
  .left {
    flex: 1;
  }
  .logo-section {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #3B82F6, #06B6D4);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 20px rgba(59,130,246,0.3);
  }
  .logo-text {
    font-size: 32px;
    font-weight: 800;
    color: #F8FAFC;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 20px;
    font-weight: 600;
    color: #94A3B8;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .tagline em {
    color: #F8FAFC;
    font-style: normal;
    font-weight: 700;
  }
  .features {
    display: flex;
    gap: 12px;
  }
  .feature-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
    color: #CBD5E1;
    font-weight: 500;
  }
  .feature-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .dot-blue { background: #3B82F6; }
  .dot-red { background: #EF4444; }
  .dot-green { background: #10B981; }

  /* 오른쪽: 미니 대시보드 카드 */
  .right {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mini-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px 20px;
    backdrop-filter: blur(10px);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card-badge {
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .badge-live {
    background: rgba(239,68,68,0.15);
    color: #F87171;
  }
  .card-score {
    font-size: 36px;
    font-weight: 800;
    color: #F8FAFC;
    line-height: 1;
  }
  .card-sub {
    font-size: 11px;
    color: #64748B;
    margin-top: 4px;
  }
  /* 국가 행 */
  .country-rows {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .country-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .country-flag { font-size: 14px; }
  .country-name { color: #CBD5E1; flex: 1; font-weight: 500; }
  .country-score { font-weight: 700; font-size: 13px; }
  .score-high { color: #F87171; }
  .score-mid { color: #FBBF24; }
  .score-low { color: #34D399; }
  .trend { font-size: 10px; margin-left: 2px; }
  .trend-up { color: #F87171; }
  .trend-down { color: #34D399; }
</style>
</head>
<body>
<div class="container">
  <div class="grid-bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <div class="content">
    <div class="left">
      <div class="logo-section">
        <div class="logo-icon">&#x1F441;</div>
        <span class="logo-text">WeWantPeace</span>
      </div>
      <div class="tagline">
        세계 분쟁이 <em>내 삶에 미치는 영향</em>,<br>
        실시간으로 추적하세요
      </div>
      <div class="features">
        <div class="feature-pill">
          <span class="dot dot-red"></span>
          긴장도 지수
        </div>
        <div class="feature-pill">
          <span class="dot dot-blue"></span>
          맞춤 알림
        </div>
        <div class="feature-pill">
          <span class="dot dot-green"></span>
          글로벌 지도
        </div>
      </div>
    </div>

    <div class="right">
      <div class="mini-card">
        <div class="card-header">
          <span class="card-label">Tension Index</span>
          <span class="card-badge badge-live">LIVE</span>
        </div>
        <div class="card-score">72</div>
        <div class="card-sub">Global Average &middot; Updated 3min ago</div>
      </div>
      <div class="mini-card">
        <div class="card-header">
          <span class="card-label">Watchlist</span>
        </div>
        <div class="country-rows">
          <div class="country-row">
            <span class="country-flag">&#x1F1FA;&#x1F1E6;</span>
            <span class="country-name">Ukraine</span>
            <span class="country-score score-high">89</span>
            <span class="trend trend-up">&#9650;3</span>
          </div>
          <div class="country-row">
            <span class="country-flag">&#x1F1F5;&#x1F1F8;</span>
            <span class="country-name">Palestine</span>
            <span class="country-score score-high">82</span>
            <span class="trend trend-up">&#9650;1</span>
          </div>
          <div class="country-row">
            <span class="country-flag">&#x1F1F8;&#x1F1E9;</span>
            <span class="country-name">Sudan</span>
            <span class="country-score score-mid">67</span>
            <span class="trend trend-down">&#9660;2</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
