<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1200px; background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; }
  .card {
    width: 1400px; padding: 80px;
    background: linear-gradient(135deg, #161b22 0%, #0d1117 50%, #1a1e2e 100%);
    border-radius: 32px; border: 1px solid #30363d;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: -200px; right: -200px;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%);
  }
  .card::after {
    content: ''; position: absolute; bottom: -100px; left: -100px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
  }
  .content { position: relative; z-index: 1; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, #2563eb, #6366f1);
    color: #fff; font-size: 18px; font-weight: 700; padding: 8px 24px;
    border-radius: 100px; letter-spacing: 1px; margin-bottom: 24px;
  }
  .logo { font-size: 48px; font-weight: 800; color: #e6edf3; margin-bottom: 8px; letter-spacing: -1px; }
  .logo span { color: #58a6ff; }
  .subtitle { font-size: 22px; color: #8b949e; margin-bottom: 48px; }
  .plan-name {
    font-size: 72px; font-weight: 800; letter-spacing: -2px; margin-bottom: 8px;
    background: linear-gradient(135deg, #58a6ff, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .price { font-size: 36px; color: #e6edf3; margin-bottom: 48px; }
  .price .amount { font-size: 56px; font-weight: 800; }
  .price .period { color: #8b949e; font-size: 24px; }
  .features { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 40px; }
  .features li {
    font-size: 20px; color: #c9d1d9; padding: 12px 0;
    border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px;
  }
  .features li::before {
    content: '✓'; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: rgba(37,99,235,0.2); color: #58a6ff; font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <span class="badge">SUBSCRIPTION</span>
    <div class="logo">&#9760; WeWantPeace <span>Pro</span></div>
    <div class="subtitle">Real-time global conflict monitoring</div>
    <div class="plan-name">Pro Plan</div>
    <div class="price">
      <span class="amount">&#8361;4,900</span>
      <span class="period"> / month</span>
    </div>
    <ul class="features">
      <li>5 monitored countries</li>
      <li>Real-time issue map</li>
      <li>Fast alerts (breaking news)</li>
      <li>10 daily alerts</li>
      <li>KScore filter (3.0-10.0)</li>
      <li>Topic filter</li>
      <li>Quiet hours</li>
      <li>30-day history</li>
      <li>Change home country</li>
    </ul>
  </div>
</div>
</body>
</html>
