# Fly.io 배포 설정 - WeWantPeace Backend
app = "wewantpeace-backend"
primary_region = "nrt"  # 도쿄

[build]
  dockerfile = "infra/Dockerfile.backend"

[env]
  PORT = "8000"
  DISABLE_AUTH = "false"
  ENVIRONMENT = "production"
  DEBUG = "false"
  LOG_LEVEL = "WARNING"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "10s"
    type = "http"

